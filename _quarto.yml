# ========== 中文摘要 ==========
cabstract: |
  本文是北京大学学位论文 Typst 模板的使用指南。该模板基于 Typst 排版系统，提供了符合北京大学研究生院学位论文要求的排版功能。

  模板支持封面、摘要、目录、图表列表、正文、参考文献、附录、致谢等全部功能，并支持盲审模式、预览模式等选项。通过 Quarto 扩展，用户可以使用 Markdown 语法编写论文，同时享受 Typst 的高质量排版效果。
ckeywords:
  - Typst
  - Quarto
  - 学位论文
  - 排版模板
  - 北京大学
# ========== 英文摘要 ==========
eabstract: |
  This document is a user guide for the Typst template for Peking University
  dissertations. The template is based on the Typst typesetting system and
  provides formatting capabilities that comply with the requirements of the
  PKU Graduate School.

  The template supports cover page, abstracts, table of contents, lists of
  figures and tables, main body, bibliography, appendices, acknowledgements,
  and more. Through the Quarto extension, users can write their theses in
  Markdown while enjoying high-quality Typst typesetting.
ekeywords:
  - Typst
  - Quarto
  - Dissertation
  - Template
  - Peking University
